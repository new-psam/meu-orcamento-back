paths:
  /transactions:
    post:
      summary: Cria uma nova transação
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - amount
                - date
                - type
                - status
                - userId
              properties:
                description:
                  type: string
                  example: "Mensalidade da Escola"
                amount:
                  type: number
                  example: 1500.50
                date:
                  type: string
                  format: date-time
                  example: "2026-05-23T10:00:00.000Z"
                type:
                  type: string
                  enum: [INCOME, EXPENSE]
                  example: "EXPENSE"
                status:
                  type: string
                  enum: [PENDING, PAID]
                  example: "PAID"
                userId:
                  type: string
                  format: uuid
                  example: "123e4567-e89b-42d3-a456-426614174000"
      responses:
        201:
          description: Transação criada com sucesso
        400:
          description: Dados inválidos fornecidos

    get:
      summary: Lista as transações do usuário (com filtros e paginação)
      tags: [Transactions]
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: ID do usuário (mesmo UUID usado no POST)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número da página
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: quantidade de itens por página
        - in: query
          name: month
          schema:
            type: integer
          description: Mês (1-12)
        - in: query
          name: year
          schema:
            type: integer
          description: "Ano (ex: 2026)"
      responses:
        200:
          description: Lista de transações retornada com sucesso
        400:
          description: Parâmetros inválidos

  /transactions/{id}:
    get:
      summary: Busca uma transação específica pelo ID
      tags: [Transactions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da transação
      responses:
        200:
          description: Transação encontrada
        400:
          description: ID inválidos
        404:
          description: Transação não encontrada

    put:
      summary: Atualiza a transação existente
      tags: [Transactions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da transação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PENDING, PAID]
                  example: "PAID"
      responses:
        200:
          description: Transação atualizada com sucesso
        400:
          description: Dados inválidos
        404:
          description: Transação não encontrada

    delete:
      summary: Deleta uma transação específica
      tags: [Transactions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da transação
      responses:
        200:
          description: Transação deletada com sucesso
        400:
          description: ID inválido
        404:
          description: Transação não encontrada
