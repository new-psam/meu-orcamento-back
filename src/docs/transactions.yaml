paths:
  /transactions:
    post:
      summary: Cria uma nova transação
      tags: [Transactions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - amount
                - date
                - type
                #- status
              properties:
                description:
                  type: string
                  example: "Mensalidade da Escola"
                amount:
                  type: number
                  example: 1500.50
                date:
                  type: string
                  format: date-time
                  example: "2026-05-23T10:00:00.000Z"
                type:
                  type: string
                  enum: [INCOME, EXPENSE]
                  example: "EXPENSE"
                status:
                  type: string
                  enum: [PENDING, PAID]
                  example: "PAID"
                categoryId:
                  type: string
                  format: uuid
                  description: ID da categoria vinculada à transação (opcional)
                isRecurring:
                  type: boolean
                  description: Define se a transição se repetirá no futuro
                  example: true
                recurrencePeriod:
                  type: string
                  enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
                  description: O intervalo de repetição caso seja recorrente
                  example: "MONTHLY"
      responses:
        201:
          description: Transação criada com sucesso
        400:
          description: Dados inválidos fornecidos

    get:
      summary: Lista as transações do usuário (com filtros e paginação)
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número da página
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: quantidade de itens por página
        - in: query
          name: month
          schema:
            type: integer
          description: Mês (1-12)
        - in: query
          name: year
          schema:
            type: integer
          description: "Ano (ex: 2026)"
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
          description: "ID da categoria para filtrar as transações por categoria(opcional)"
      responses:
        200:
          description: Lista de transações retornada com sucesso
        400:
          description: Parâmetros inválidos

  /transactions/summary:
    get:
      summary: Retorna o resumo financeiro (receitas, despesas e saldo)
      tags: [Transactions]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Resumo calculado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  incomes:
                    type: number
                    description: Total de receitas
                    example: 5000
                  expenses:
                    type: number
                    description: Total de despesas
                    example: 1700
                  balance:
                    type: number
                    description: Saldo final (receitas - despesas)
                    example: 3300
        401:
          description: Token de autenticação não fornecido ou inválido
        500:
          description: Erro interno do servidor

  /transactions/{id}:
    get:
      summary: Busca uma transação específica pelo ID
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da transação
      responses:
        200:
          description: Transação encontrada
        400:
          description: ID inválidos
        404:
          description: Transação não encontrada

    put:
      summary: Atualiza a transação existente
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da transação
        - in: query
          name: updateAll
          schema:
            type: boolean
          description: Se true, atualiza esta transação e todas as futuras do mesmo grupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  example: "Mensalidade Escola"
                amount:
                  type: number
                  example: 1600.50
                date:
                  type: string
                  format: date-time
                type:
                  type: string
                  enum: [INCOME, EXPENSE]
                status:
                  type: string
                  enum: [PENDING, PAID]
                categoryId:
                  type: string
                  format: uuid
                  nullable: true
                isRecurring:
                  type: boolean
                recurrencePeriod:
                  type: string
                  enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
      responses:
        200:
          description: Transação atualizada com sucesso
        400:
          description: Dados inválidos
        404:
          description: Transação não encontrada

    delete:
      summary: Deleta uma transação específica
      tags: [Transactions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID da transação
        - in: query
          name: deleteAll
          schema:
            type: boolean
          description: Se true, delete esta transação e todas as futuras do mesmo grupo
      responses:
        200:
          description: Transação deletada com sucesso
        400:
          description: ID inválido
        404:
          description: Transação não encontrada
