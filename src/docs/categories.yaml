paths:
  /categories:
    post:
      summary: Cria uma nova categoria
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: O nome da categoria (não pode ser duplicado para o mesmo usuário)
                  example: "Alimentação"
                color:
                  type: string
                  description: A cor de exibição da categoria no frontend
                  example: "azul"
                parentId:
                  type: string
                  format: uuid
                  description: O ID da categoria pai, se for uma subcategoria
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        201:
          description: Categoria criada com sucesso
        400:
          description: Dados inválidos ou você já possui uma categoria com esse nome
        401:
          description: Token de autenticação não fornecido ou inválido

    get:
      summary: Lista todas as categorias do usuário logado
      tags: [Categories]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de categorias retornada com sucesso (em ordem alfabética)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: O ID da categoria
                      example: "123e4567-e89b-12d3-a456-426614174000"
                    name:
                      type: string
                      description: O nome normalizado da categoria
                      example: "Alimentação"
                    color:
                      type: string
                      nullable: true
                      description: A cor de exibição da categoria no frontend
                      example: "azul"
                    parentId:
                      type: string
                      format: uuid
                      nullable: true
                      description: O ID da categoria pai (retorna null se for uma categoria  principal)
                      example: null
                    userId:
                      type: string
                      format: uuid
                      description: O ID do usuário dono da categoria
                      example: "123e4567-e89b-12d3-a456-426614174000"
                    createdAt:
                      type: string
                      format: date-time
                      description: A data e hora de criação da categoria
                      example: "2024-01-01T12:00:00Z"
        401:
          description: Token de autenticação não fornecido ou inválido
        500:
          description: Erro interno do servidor

  /categories/{id}:
    put:
      summary: Atualiza uma categoria existente
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: O ID da categoria a ser atualizada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: O novo nome da categoria (não pode ser duplicado para o mesmo usuário)
                  example: "Alimentação"
                color:
                  type: string
                  description: A nova cor de exibição da categoria no frontend
                  example: "azul"
                parentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: O novo ID da categoria pai, se for uma subcategoria (pode ser null para tornar principal)
                  example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        200:
          description: Categoria atualizada com sucesso
        400:
          description: Dados inválidos ou você já possui uma categoria com esse nome
        401:
          description: Token de autenticação não fornecido ou inválido
        404:
          description: Categoria não encontrada ou não pertence ao usuário

    delete:
      summary: Remove uma categoria
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: O ID da categoria a ser removida
      responses:
        204:
          description: Categoria removida com sucesso
        401:
          description: Token de autenticação não fornecido ou inválido
        404:
          description: Categoria não encontrada ou não pertence ao usuário
